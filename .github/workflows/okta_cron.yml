name: Okta Log Generator Schedule

on:
  schedule:
    # Runs at minute 0 every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from UI

jobs:
  run-okta-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Execute log generator script
        env:
          OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
        run: python generate_logs.py
